brama_1a:
  sequence:
  - action: modbushas.write_register
    data:
      address: 546
      slave: 1
      value: 5
  alias: Brama 1a
  description: ''
light_night_on:
  sequence:
  - action: light.turn_on
    data:
      entity_id: light.light_drzwifrontowe, light.light_roof_front1, light.light_roof_back1,
        light.light_ogrod_front, light.light_schody_led, light.light_korytarzgora_led1,
        light.light_halldol_led
  - action: cover.set_cover_position
    data:
      position: 25
    target:
      entity_id:
      - cover.sypialnia_roleta_1
      - cover.sypialnia_roleta_2
light_day_off:
  sequence:
  - action: light.turn_off
    data:
      entity_id: light.light_drzwifrontowe, light.light_roof_front1, light.light_roof_back1,
        light.light_ogrod_front, light.light_schody_led, light.light_korytarzgora_led1,
        light.light_halldol_led
ogrod_planpodlewania_toggle:
  alias: Przelacz program podlewania
  sequence:
  - action: modbushas.write_register
    data:
      slave: 1
      address: 1049
      value: 1
ogrod_podlewanie_toggle:
  alias: Wlacz / wylacz podlewanie
  sequence:
  - action: modbushas.write_register
    data:
      slave: 1
      address: 1049
      value: 2
ogrod_woda_toggle:
  alias: Wlacz / wylacz wode w ogrodzie
  sequence:
  - action: modbushas.write_register
    data:
      slave: 1
      address: 1049
      value: 3
sypialnia_night:
  alias: Wieczorek we dwoje
  sequence:
  - action: light.turn_off
    data:
      entity_id: light.light_sypialnia_sufit1, light.light_sypialnia_kinkiet1, light.light_sypialnia_kinkiet2,
        light.light_garderoba_sufit
  - action: light.turn_on
    data:
      entity_id: light.light_sypialnia_led1
  - action: media_player.turn_on
    data:
      entity_id: media_player.MiniWieza
  - action: media_player.select_source
    data:
      entity_id: media_player.MiniWieza
      source: Internet
  - action: media_player.volume_set
    data:
      entity_id: media_player.MiniWieza
      volume_level: 0.1
  - action: cover.set_cover_position
    data:
      position: 25
    target:
      entity_id:
      - cover.sypialnia_roleta_1
      - cover.sypialnia_roleta_2
podejdz_do_telefonu:
  sequence:
  - action: modbushas.write_register
    data:
      address: 1000
      slave: 1
      value: 2
  alias: podejdz_do_telefonu
  description: ''
