- sensor:
    - name: "Ziemia od deszczu"
      unique_id: ogrod_deszcz_tmpl
      state: '{% if is_state("sensor.ogrod_susza", "1") %}susza{% else%}mokra{% endif%}'
    - name: "Status programu podlewania"
      unique_id: ogrod_status_podlewania_tmpl
      state: >-
        {%- if is_state("sensor.ogrod_status_programu", "1") %}
        planowane na rano
        {% elif is_state("sensor.ogrod_status_programu", "2") %}
        podlewanie
        {% elif is_state("sensor.ogrod_status_programu", "3") %}
        podlewalo sie
        {%else%}
        wylaczony
        {%- endif%}
    - name: "Woda w ogrodzie"
      unique_id: ogrod_status_wody_tmpl
      state: >-
        {%- if is_state("sensor.ogrod_status_wody", "0") %}
        jest woda w studni
        {% elif is_state("sensor.ogrod_status_wody", "1") %}
        brak wody w studni
        {% elif is_state("sensor.ogrod_status_wody", "2") %}
        cisnienie ze studni
        {%else%}
        cienienie z sieci
        {%- endif%}
    - name: "Alarm - status"
      unique_id: alarm_onoff_tmpl
      state: '{% if is_state("sensor.satel_onoff", "1") %}on{% else%}off{% endif%}'
