write_register:
  name: Write Modbus register
  description: Zapisuje wartość do pojedynczego rejestru Modbus holding register.
  fields:
    address:
      name: Address
      description: Adres rejestru Modbus.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: Wartość do zapisania (0-65535).
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    slave:
      name: Slave
      description: Adres urządzenia Modbus (domyślnie 1).
      default: 1
      required: false
      selector:
        number:
          min: 1
          max: 247
          mode: box
